<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
<title>Thornwick Recreation Ground</title>
<rect x="0" y="0" width="640" height="320" fill="#ffffff" stroke="#333333"/>
<rect x="40" y="60" width="260" height="180" fill="#cfe8cf" stroke="#444444"/>
<rect x="340" y="60" width="260" height="180" fill="#cfe8cf" stroke="#444444"/>
