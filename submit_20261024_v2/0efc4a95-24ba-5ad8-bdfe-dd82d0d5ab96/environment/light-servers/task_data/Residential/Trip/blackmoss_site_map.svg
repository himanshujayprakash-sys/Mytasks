<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" baseProfile="full" width="640" height="400" xmlns="http://www.w3.org/2000/svg">
<desc>Sketch of the Blackmoss site sent by the centre, for orienting staff only</desc>
<g id="area0"><rect x="30" y="60" rx="12" ry="12" width="270" height="130" stroke="#4a6" fill="#eef7ee"/><text x="44" y="90" style="font: bold 15px Georgia">Dormitory block</text><text x="44" y="116" style="font: 12px Georgia">girls upstairs, boys on the ground floor</text></g>
<g id="area1"><rect x="330" y="60" rx="12" ry="12" width="270" height="130" stroke="#4a6" fill="#eef7ee"/><text x="344" y="90" style="font: bold 15px Georgia">Dining hall</text><text x="344" y="116" style="font: 12px Georgia">allergy table beside the servery</text></g>
<g id="area2"><rect x="30" y="230" rx="12" ry="12" width="270" height="130" stroke="#4a6" fill="#eef7ee"/><text x="44" y="260" style="font: bold 15px Georgia">Climbing wall</text><text x="44" y="286" style="font: 12px Georgia">indoor, harnesses in the store</text></g>
<g id="area3"><rect x="330" y="230" rx="12" ry="12" width="270" height="130" stroke="#4a6" fill="#eef7ee"/><text x="344" y="260" style="font: bold 15px Georgia">Lake and boathouse</text><text x="344" y="286" style="font: 12px Georgia">canoes and buoyancy aids</text></g>
<line x1="165" y1="190" x2="165" y2="230" stroke="#555"/><line x1="465" y1="190" x2="465" y2="230" stroke="#555"/>
<text x="30" y="385" style="font: italic 11px Georgia">Paths between buildings are lit after dark.</text>
</svg>
