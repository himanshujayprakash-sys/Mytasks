<svg xmlns="http://www.w3.org/2000/svg" width="900" height="104" viewBox="0 0 900 104">
<title>Allergen symbols key</title>
<rect x="1" y="1" width="898" height="102" fill="#ffffff" stroke="#333333"/>
<text x="20" y="34" font-family="Arial" font-size="18" font-weight="bold">Allergen symbols key</text>
<text x="24" y="62" font-family="Arial" font-size="13">G gluten, M milk, E egg, F fish, N nuts, P peanuts, S sesame</text>
<text x="24" y="84" font-family="Arial" font-size="13">Mu mustard, C celery, Cr crustaceans</text>
</svg>
